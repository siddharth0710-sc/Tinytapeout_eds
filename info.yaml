# Tiny Tapeout project information
project:
  title:        "tinytapeouteds"
  author:       "Siddharth A S"
  discord:      ""
  description:  "8-bit combinational adder"
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies?
  tiles: "1x1"

  # Your top module name
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "I[0]"
  ui[1]: "I[1]"
  ui[2]: "I[2]"
  ui[3]: "I[3]"
  ui[4]: "I[4]"
  ui[5]: "I[5]"
  ui[6]: "I[6]"
  ui[7]: "I[7]"

  # Outputs
  uo[0]: "O[0]"
  uo[1]: "O[1]"
  uo[2]: "O[2]"
  uo[3]: "O[3]"
  uo[4]: "O[4]"
  uo[5]: "O[5]"
  uo[6]: "O[6]"
  uo[7]: "O[7]"

  # Bidirectional pins
  uio[0]: "IO[0]"
  uio[1]: "IO[1]"
  uio[2]: "IO[2]"
  uio[3]: "IO[3]"
  uio[4]: "IO[4]"
  uio[5]: "IO[5]"
  uio[6]: "IO[6]"
  uio[7]: "IO[7]"

# Do not change!
yaml_version: 6
